# ===== Server =====
server.port=8080

# ===== Application name (shows up in logs) =====
spring.application.name=bookverse-backend

# ===== Database connection (MSSQL) =====
# Replace localhost\\SQLEXPRESS with YOUR server name if different
# (check what you saw when connecting in SSMS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bookverse;encrypt=true;trustServerCertificate=true
spring.datasource.username=bookverse_app
spring.datasource.password=@Patel_01
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JWT =====
# This secret key SIGNS every token - anyone with this key could forge
# valid tokens, so in a real production app this would come from an
# environment variable, never committed to Git. For a college project,
# keeping it here is fine, just don't publish this exact key publicly.
jwt.secret=QyEaWhurRO72REXVlO6ruCMcDs6uoF44OgaHXJfkzXkaQMTnIKtPjC1k+T0FTmb4
# Access token: short-lived (15 min) - sent on every request, so if one
# ever leaks, the exposure window is small.
jwt.access-expiration-ms=900000
# Refresh token: long-lived (7 days) - stored in the DB, used only to
# get a new access token, so the user doesn't need to log in constantly.
jwt.refresh-expiration-ms=604800000

# 'update' means Hibernate will auto-create/update tables based on our
# @Entity classes as we build them in Phase 3. Never use 'update' (or
# especially 'create') in a real production app - but it's perfect for
# learning and fast iteration in a college project.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs, in your console - great for learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate to generate SQL Server compatible SQL syntax
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
