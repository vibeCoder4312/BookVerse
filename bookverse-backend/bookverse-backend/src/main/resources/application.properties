# ===== Server =====
server.port=8080

# ===== Application name (shows up in logs) =====
spring.application.name=bookverse-backend

# ===== Database connection (MSSQL) =====
# Replace localhost\\SQLEXPRESS with YOUR server name if different
# (check what you saw when connecting in SSMS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bookverse;encrypt=true;trustServerCertificate=true
spring.datasource.username=bookverse_user
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# 'update' means Hibernate will auto-create/update tables based on our
# @Entity classes as we build them in Phase 3. Never use 'update' (or
# especially 'create') in a real production app - but it's perfect for
# learning and fast iteration in a college project.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs, in your console - great for learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate to generate SQL Server compatible SQL syntax
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
